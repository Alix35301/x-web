version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.expense-web.rule=Host(`expense.localhost`)"
      - "traefik.http.services.expense-web.loadbalancer.server.port=3000"
    restart: unless-stopped

networks:
  traefik-proxy:
    external: true
